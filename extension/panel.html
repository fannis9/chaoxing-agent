<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>学习通控制台</title>
<link rel="stylesheet" href="panel.css">
<main>
  <header><h1>学习通控制台</h1><button id="refresh" class="quiet" title="刷新状态">刷新</button></header>
  <p id="page">正在读取页面…</p>
  <p id="chapter"></p>
  <section><h2>连接状态</h2><div id="connection">正在连接本机控制端…</div></section>
  <section><h2>当前任务</h2><div id="status">等待页面状态</div></section>
  <section class="task-card"><h2>视频任务</h2><div id="video">等待章节状态</div><progress id="videoProgress" max="100" value="0" hidden></progress></section>
  <section class="task-card"><h2>解题任务</h2><div id="quiz">当前没有待处理测验</div></section>
  <section><h2>自动流程</h2><div id="automatic">等待调度器</div></section>
  <section><h2>最近日志</h2><pre id="log">暂无日志</pre></section>
  <section><h2>模型配置</h2><div id="modelStatus">正在读取…</div>
    <label>模型名称<input id="modelName"></label><label>模型 ID<input id="modelId"></label>
    <label>API 基础地址<input id="baseUrl"></label><label>密钥环境变量<input id="keyEnv"></label>
    <div class="actions"><button id="saveModel">保存配置</button><button id="testModel">测试连接</button></div></section>
  <section><h2>模型对话</h2><div id="conversation"></div>
    <textarea id="prompt" rows="3" placeholder="输入消息"></textarea>
    <div class="actions"><button id="send">发送</button><button id="clearChat">新对话</button></div></section>
</main>
<footer><div class="run-line"><span id="pulse" aria-label="运行状态"></span><span id="runSummary">正在读取运行状态…</span></div>
  <div class="actions"><button id="start">启动</button><button id="pause">暂停</button><button id="resume">继续</button><button id="stopAll">停止队列</button></div>
  <div class="secondary"><button id="stop">停止本页脚本</button><span id="message" role="status"></span></div>
</footer>
<script src="snapshot.js"></script>
<script src="panel.js"></script>
</html>
