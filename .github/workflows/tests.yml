name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: 安装依赖（playwright-core 用不到浏览器）
        run: npm install --no-audit --no-fund
      - name: 规则 / 命令解析 / 课程调度 / hub 集成
        run: npm test
